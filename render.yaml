services:
  # 1. PYTHON BACKEND (FastAPI)
  - type: web
    name: tasks-backend
    runtime: python
    plan: free # Ensures you are not prompted for payment details
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9 # Fixes pydantic-core build error
      - key: DATABASE_URL
        sync: false # Prompts you in the Render UI to paste your Supabase URL

  # 2. REACT FRONTEND (Vite + React)
  - type: web
    name: tasks-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tasks-backend-7j6e.onrender.com # Explicit HTTPS URL